name: Deploy front

# Build (Vite) y despliegue a Azure Static Web Apps en cada push a main.
# Las URLs del back salen de Settings > Secrets and variables > Actions > Variables.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-front
  cancel-in-progress: false

jobs:
  deploy:
    name: Build y deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fijada por SHA (rama v1 de Microsoft; el tag v1 es de 2021)
      - name: Deploy a Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          output_location: "dist"
        env:
          # Vite las incrusta en el build
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
          VITE_USE_MOCKS: "false"
